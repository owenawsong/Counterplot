name: Verify toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: counterplot-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            counterplot-*.tgz
            site/
